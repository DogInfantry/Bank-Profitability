name: ci
# On every push and pull request: rebuild the HDFC model and its outputs from committed data, then run the
# reconciliation checks, the test suite and the code lint. No network fetch; the steerco deck is on hold.
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-calc
      - name: Model, outputs and tests
        run: make all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: |
            models/*.xlsx
            decks/HDFC_CEO_Memo.docx
            viz/dashboard.html
            data/tidy/sql_results/*.csv
