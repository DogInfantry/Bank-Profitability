name: refresh
# Weekly full refresh: fetch public sources and Screener, rebuild the sector modules and the HDFC model, then test.
# Manual inputs (NPCI app files, IRDAI Handbook and consultation) are user-supplied; when absent from the runner the
# sector step reuses the committed tidy files (`|| true`) and the HDFC model still rebuilds.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-calc libreoffice-writer libreoffice-impress
      - name: Fetch public sources and Screener
        run: make data
      - name: Sector modules
        run: make sector || true
      - name: HDFC model, outputs and tests
        run: make all
      - name: PDFs of the memo and sector decks
        run: |
          soffice --headless --convert-to pdf --outdir decks/pdf decks/HDFC_CEO_Memo.docx decks/0*.pptx
      - uses: actions/upload-artifact@v5
        with:
          name: outputs
          path: |
            models/*.xlsx
            viz/dashboard.html
            decks/*.pptx
            decks/*.docx
            decks/pdf/*.pdf
            data/tidy/sql_results/*.csv
